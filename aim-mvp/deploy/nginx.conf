# /etc/nginx/sites-available/aim-airbnb  (adjust server_name, root and the php-fpm socket)
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    root /var/www/aim-airbnb/public;
    index index.html;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /sitemap.xml { rewrite ^ /sitemap.php last; }
    location ~ ^/stays/([^/]+)/?$ { rewrite ^/stays/([^/]+)/?$ /property.php?slug=$1 last; }
    location /api/ { rewrite ^ /api/index.php last; }

    # Only these three PHP files may run. Everything else (including uploads) is never executed.
    location ~ ^/(api/index|property|sitemap)\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
    location ~ \.php$ { return 404; }

    location /uploads/ { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /404.html;
}
# HTTPS: sudo certbot --nginx -d your-domain.com -d www.your-domain.com
